AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Practice 7 - IAM roles for GitHub Actions with OIDC (no access keys).
  The OIDC identity provider token.actions.githubusercontent.com is created once in the IAM console.

Parameters:
  GitHubSubject:
    Type: String
    # repo created after 15 July 2026 -> immutable format owner@ID/repo@ID
    Default: repo:aliyushaK@180263043/cad-sis3-orders@1467461096:environment:production
    Description: The only workflow allowed to assume the deploy role
  AppStackName:
    Type: String
    Default: sis3-orders
  ImageRepositoryName:
    Type: String
    Default: cad-sis3-orders

Resources:
  # Role that CloudFormation itself uses to change the application stack.
  CfnExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: cloudformation.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/PowerUserAccess        # everything except IAM
      Policies:
        - PolicyName: manage-app-stack-roles-only
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:PassRole
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:GetRolePolicy
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:UpdateAssumeRolePolicy
                Resource: !Sub arn:aws:iam::${AWS::AccountId}:role/${AppStackName}-*

  # Role that the GitHub Actions job assumes through OIDC.
  GitHubDeployRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Assumed by GitHub Actions (production environment) via OIDC
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: sts:AssumeRoleWithWebIdentity
            Principal:
              Federated: !Sub arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub: !Ref GitHubSubject
      Policies:
        - PolicyName: build-push-deploy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: EcrLogin
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Sid: EcrPushOneRepo
                Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                  - ecr:PutImage
                  - ecr:BatchGetImage
                Resource: !Sub arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/${ImageRepositoryName}
              - Sid: DeployOneStack
                Effect: Allow
                Action:
                  - cloudformation:CreateChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:GetTemplateSummary
                Resource: !Sub arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AppStackName}/*
              - Sid: HandOverToCloudFormation
                Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt CfnExecutionRole.Arn
              - Sid: ReadOnlyEvidence
                Effect: Allow
                Action: [ecs:DescribeServices, ecs:DescribeTaskDefinition]
                Resource: "*"

Outputs:
  DeployRoleArn:
    Value: !GetAtt GitHubDeployRole.Arn
  CfnExecutionRoleArn:
    Value: !GetAtt CfnExecutionRole.Arn
